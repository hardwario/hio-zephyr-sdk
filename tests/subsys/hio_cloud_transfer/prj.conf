CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096

CONFIG_LOG=y

# hio_cloud_transfer.c deps (manual compile)
CONFIG_HIO_BUF=y
CONFIG_ZCBOR=y

# hio_cloud_util.h (included by hio_cloud_packet.c) needs the PSA Crypto
# headers (CONFIG_HIO_CLOUD_HASH_PSA is defined in CMakeLists.txt for manual
# compile). The hash itself is a stub, see src/mock_hio_lte.c.
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_ENTROPY_GENERATOR=y
