CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_LOG=y

# hio_cloud.c deps (manual compile)
CONFIG_EVENTS=y
CONFIG_HIO_BUF=y
CONFIG_ZCBOR=y
CONFIG_ZCBOR_STOP_ON_ERROR=y

# hio_cloud_util.h (included by hio_cloud.c) needs the PSA Crypto headers
# (CONFIG_HIO_CLOUD_HASH_PSA is defined in CMakeLists.txt for manual compile).
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_CRC=y
