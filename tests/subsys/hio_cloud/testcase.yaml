tests:
  hio_cloud.send:
    tags: hio hio_cloud
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
  # Same sources with the init work finding no firmware update id
  hio_cloud.send.fw_none:
    tags: hio hio_cloud
    extra_args: TEST_FW=0
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
  # The first ack of a firmware update fails
  hio_cloud.send.fw_ack_fail:
    tags: hio hio_cloud
    extra_args: TEST_FW=2
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
  # An update id stored, but MCUboot reverted the update
  hio_cloud.send.fw_reverted:
    tags: hio hio_cloud
    extra_args: TEST_FW=3
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
  # An update id stored, but the image cannot be confirmed
  hio_cloud.send.fw_confirm_fail:
    tags: hio hio_cloud
    extra_args: TEST_FW=4
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
  # The config cannot be packed
  hio_cloud.send.config_pack_fail:
    tags: hio hio_cloud
    extra_args: TEST_CONFIG_PACK_FAIL=1
    platform_allow:
      - native_sim
    integration_platforms:
      - native_sim
