CONFIG_HIO_DEFAULTS=y
CONFIG_HIO_LOG=y
CONFIG_HIO_SHELL=y

# hio_info needs the VERSION file (app_version.h) next to CMakeLists.txt
CONFIG_HIO_INFO=y

CONFIG_HIO_CLOUD=y

# SHA-256 via PSA Crypto (provided by TF-M on _ns targets); the mbedTLS legacy
# backend does not configure on NCS v3.4 and TinyCrypt is not available.
CONFIG_HIO_CLOUD_HASH_PSA=y

# The minimal TF-M profile is enough for PSA SHA-256. The application uses
# almost the whole flash, see boards/nrf9151dk_nrf9151_ns.overlay.
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y
